services:
  arachne:
    build: .
    image: arachne:latest
    container_name: arachne
    restart: unless-stopped
    # Reaps zombies and forwards SIGTERM to node, so SQLite closes cleanly on a
    # restart. Docker's own init, rather than a tini package in the image.
    init: true
    # Host port only. The container always listens on 3000, so changing this
    # needs no rebuild — edit .env and `docker compose up -d`.
    ports:
      - "${ARACHNE_PORT:-3000}:3000"
    environment:
      APP_PASSWORD: ${APP_PASSWORD:?set APP_PASSWORD in .env}
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET in .env}
      NANOGPT_API_KEY: ${NANOGPT_API_KEY:-}
      NANOGPT_VISION_MODEL: ${NANOGPT_VISION_MODEL:-}
      NANOGPT_BASE_URL: ${NANOGPT_BASE_URL:-https://nano-gpt.com/api/v1}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      DATABASE_PATH: /data/db/arachne.db
      UPLOAD_DIR: /data/uploads
      BACKUP_DIR: /data/backups
      # Daily backups kept. The next one written drops the oldest. 0 disables.
      BACKUP_KEEP: ${BACKUP_KEEP:-31}
      # TZ decides which calendar day a backup belongs to, so it has to be set.
      TZ: ${TZ:-Europe/Berlin}
      # The hour a day turns over, local time. 4 covers an ordinary late night;
      # raise it if you are reliably up later. 0 restores midnight.
      DAY_START_HOUR: ${DAY_START_HOUR:-4}
    volumes:
      - arachne-db:/data/db
      - arachne-uploads:/data/uploads
      # Its own volume, so the backups survive `docker compose down -v` on the
      # others and can be mounted somewhere else — a NAS path, say — by editing
      # this one line.
      - arachne-backups:/data/backups
    healthcheck:
      # node rather than wget or curl: neither is guaranteed to be in a slim
      # base image, and the one binary this container certainly has is node.
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  arachne-db:
  arachne-uploads:
  arachne-backups:
